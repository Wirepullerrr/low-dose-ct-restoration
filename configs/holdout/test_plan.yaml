# ---------------------------------------------------------------------------
# What a conclusion may say, fixed before the result exists
# ---------------------------------------------------------------------------
interpretation_rules:
  directionally_consistent:
    requires_mean_oriented_improvement_same_direction: true
    requires_minimum_seeds_favouring: 4
    of_seeds: 5
    phrase: directionally consistent across training seeds
  all_five_phrase: all five seeds favoured
  three_of_five_may_be_called_consistent: false
  overall_architecture_statement:
    requires_all_metrics: 8
    requires_same_architecture_on_every_metric: true
    otherwise: report the pattern metric by metric
  causal_claims: false
  note: >-
    Descriptive, not causal. The U-Net and the CNN differ in parameter count,
    receptive field, pooling, decoder and skip connections all at once, so no
    difference is attributed to any one of them.

claim_rules:
  requires_computed_from_frozen_test_outputs: true
  requires_positive_architecture_mean_improvement: true
  required_context:
    - held-out
    - six patients
    - synthetic low-dose-like degradation
    - five predeclared training seeds
  template: >-
    On six held-out CHAOS patients with synthetic low-dose-like degradation,
    the <architecture> improved <metric> by X over the degraded input,
    averaged across five predeclared training seeds.
  all_five_seeds_phrase: all five seeds improved
  all_five_seeds_phrase_requires: every one of the five seeds improved that metric over degraded
  forbidden:
    - clinically meaningful
    - real low-dose performance
    - dose reduction
    - caused by the U-Net architecture
    - statistically significant
    - generalizes to other scanners or institutions
    - production-ready

# ---------------------------------------------------------------------------
# Failure, interruption and software bugs
# ---------------------------------------------------------------------------
failure_policy:
  # Nothing a test result shows may change anything. The list is empty.
  test_result_may_trigger: []
  on_software_bug: >-
    Stop. Document the exact bug, whether any held-out result was exposed,
    whether it affects a scientific decision, and what repair would be
    needed. Do not decide alone that a rerun is harmless.
  on_interruption: >-
    Preserve the staging directory, its log and its failure record. Do not
    read partial tables for results, delete evidence, or alter code or
    parameters and retry.
  silent_patch_and_rerun: false
  restart_requires_integrity_review: true

# ---------------------------------------------------------------------------
# Outputs: tables only, assembled in staging, moved into place when complete
# ---------------------------------------------------------------------------
outputs:
  root: outputs/metrics/holdout/test
  staging: outputs/metrics/holdout/test.incomplete
  files:
    - degraded_test_slices.csv
    - degraded_test_patients.csv
    - degraded_test_summary.json
    - clahe_test_slices.csv
    - clahe_test_patients.csv
    - clahe_test_summary.json
    - clahe_vs_degraded_test_patient_deltas.csv
    - deterministic_methods.csv
    - seed_level_metrics.csv
    - paired_seed_deltas.csv
    - learned_vs_degraded.csv
    - learned_vs_clahe.csv
    - validation_to_test.csv
    - holdout_test_summary.json
    - opening_record.json
    - execution_log.txt
    - execution_receipt.json
  per_seed_directory: "seed{seed}"
  per_seed_files:
    - cnn_test_slices.csv
    - cnn_test_patients.csv
    - cnn_test_summary.json
    - unet_test_slices.csv
    - unet_test_patients.csv
    - unet_test_summary.json
    - cnn_vs_degraded_test_patient_deltas.csv
    - cnn_vs_clahe_test_patient_deltas.csv
    - unet_vs_degraded_test_patient_deltas.csv
    - unet_vs_clahe_test_patient_deltas.csv
    - unet_vs_cnn_test_patient_deltas.csv
  # No figure, no image, no array, no model output of any kind.
  image_outputs: []

execution_receipt:
  path: outputs/metrics/holdout/test/execution_receipt.json
  required_fields:
    - receipt_schema
    - status
    - git
    - test_plan
    - split_sha256
    - manifest_sha256
    - environment
    - learned_checkpoints
    - shared_configs
    - test_subjects
    - expected_patients
    - expected_slices
    - actual_patients
    - actual_slices
    - test_opening_started_utc
    - completed_utc
    - image_reads
    - visual_outputs_created
    - overwrite_occurred
    - retry_occurred
    - prior_attempt_detected
    - outputs
    - metric_values_in_receipt
  # The receipt records what ran and what was read. It holds no metric value
  # and no decision based on one.
  metric_values: false
