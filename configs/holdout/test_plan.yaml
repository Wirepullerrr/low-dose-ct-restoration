# The held-out test cohort, taken from committed metadata only
# ---------------------------------------------------------------------------
split: test
expected_subjects: ["11", "13", "19", "25", "29", "32"]
expected_patients: 6
expected_slices: 941
expected_slices_by_subject:
  "11": 83
  "13": 89
  "19": 90
  "25": 235
  "29": 214
  "32": 230

# Stress stays sealed. It is not part of this milestone and cannot influence
# any test conclusion; the runner refuses to open a single stress file.
stress_subjects_sealed: ["1", "6", "39"]

data_root: data/raw/chaos
