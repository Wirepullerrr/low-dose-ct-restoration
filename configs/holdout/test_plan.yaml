# ---------------------------------------------------------------------------
# What is forbidden. Each must be the boolean false.
# ---------------------------------------------------------------------------
stress_allowed: false
visual_inspection_allowed: false
image_outputs_allowed: false
retraining_allowed: false
fine_tuning_allowed: false
hyperparameter_change_allowed: false
checkpoint_selection_after_test: false
best_seed: false
representative_seed: false
checkpoint_averaging: false
model_ensembling: false
calibration_on_test: false
per_patient_method_selection: false
overwrite_allowed: false
automatic_retry_allowed: false
significance_testing: false
confidence_intervals: false
p_values: false
composite_score: false
seed_ranking: false
seed_exclusion: false

# ---------------------------------------------------------------------------
# Methods entering test: exactly these four
# ---------------------------------------------------------------------------
methods:
  - degraded
  - clahe
  - cnn
  - unet

# The learned checkpoints are evaluated on the device their validation
# numbers were measured on. The runner refuses if CUDA is unavailable rather
# than silently falling back to CPU.
device: cuda

# ---------------------------------------------------------------------------
# The Milestone 1-6 definitions, unchanged
# ---------------------------------------------------------------------------
#
# sha256_lf is the SHA-256 of the file with CRLF read as LF. These four
# configs are not line-ending pinned in .gitattributes, so their bytes differ
# between checkouts while their content does not. The parsed settings below
# must equal both the file and the policy each tracked validation summary
# records it was measured under.
frozen_policies:
  preprocessing:
    config: configs/baseline.yaml
    sha256_lf: e69e6ae64506f6d45e92bf3a10119a834d04ae30e6f710d9380fa45ae0939cd5
    settings:
      window_center: 40
      window_width: 400
      image_size: [256, 256]
      interpolation: area
  degradation:
    config: configs/degradation.yaml
    sha256_lf: 1b2dccb9cfd84f797ef554687493431aba6cae36389c8c212fbc216e7977e98d
    settings:
      algorithm: correlated_heteroscedastic_gaussian_v1
      global_seed: 2026
      sigma_floor: 0.015
      sigma_signal: 0.035
      correlation_sigma_px: 0.6
      clip_min: 0.0
      clip_max: 1.0
    # One realization per test slice, generated once and handed to every
    # method. The degradation seed never depends on a training seed.
    one_realization_per_slice_shared_by_every_method: true
    depends_on_training_seed: false
  evaluation:
    config: configs/evaluation.yaml
    sha256_lf: 84a227625d5ccaa187b7207e17a7131226d6669316472ca44aec0f269f3f313c
    settings:
      data_range: 1.0
      ssim:
        win_size: 11
        gaussian_weights: true
        sigma: 1.5
        use_sample_covariance: false
        data_range: 1.0
      body_mask:
        threshold_hu: -500.0
        connectivity: 8
        keep_largest_component: true
        fill_holes: true
        resize_interpolation: nearest
      aggregation:
        slice_to_patient: arithmetic_mean
        patient_to_split: arithmetic_mean
        primary_unit: patient
  clahe:
    config: configs/clahe.yaml
    sha256_lf: 491573a15c476b30b7789244cf6c6d4de0d429cdb3d7c08860042d6b5cd3737f
    # Selected on validation in Milestone 6. Not retuned on test.
    settings:
      algorithm: opencv_clahe_v1
      input_quantization_bits: 8
      clip_limit: 0.5
      tile_grid_size: [4, 4]
    retuning_allowed: false

