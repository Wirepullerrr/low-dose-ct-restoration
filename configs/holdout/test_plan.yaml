# Milestone 11 - the one-shot held-out test protocol
#
# FROZEN BEFORE ANY HELD-OUT TEST IMAGE IS READ.
#
# This file is the whole final measurement: which patients, which methods,
# which ten learned checkpoints, which metrics, how they are aggregated, how
# the methods are compared, what a conclusion may say, and what happens if
# anything goes wrong. It was written and committed before the test split was
# opened, and nothing in it may change afterwards.
#
# scripts/run_holdout_test.py executes it, once. src/ct_restoration/holdout.py
# refuses to run unless this file agrees with that module's frozen constants,
# with the committed split and manifest, with every tracked Milestone 5-10
# artifact cited below, and with the bytes of every checkpoint.
#
# WHAT THE TEST RESULT IS
# -----------------------
# A measurement of decisions already made, on six patients no development
# step has read since the split was frozen. It is not a new model-selection
# round. A disappointing result is the project's result: it triggers no
# retraining, no new seed, no changed checkpoint and no changed parameter.
#
# WHAT IT IS NOT
# --------------
# Six held-out CHAOS patients under a SYNTHETIC low-dose-like image-domain
# degradation. Not real low-dose CT, not a dose-reduction figure, not a
# clinical evaluation, and not evidence about other scanners or institutions.
# No significance test and no confidence interval is computed.

milestone: 11
stage: protocol_frozen_execution_pending
protocol_version: m11_holdout_test_v1

# The Milestone 10 commit: every method decision was final there. The code
# that executes this plan is recorded separately, at execution, in the
# receipt, and must descend from this commit with a clean working tree.
development_frozen_commit: f1fc6dd6714e8e818d27b9c4e52dc3aadbd4318e
frozen_before_any_test_image_is_read: true

