# ---------------------------------------------------------------------------
# Planned outputs. None of these exists yet.
# ---------------------------------------------------------------------------
planned_outputs:
  primary:
    - outputs/metrics/multiseed/seed_level_metrics.csv
    - outputs/metrics/multiseed/paired_seed_deltas.csv
    - outputs/metrics/multiseed/multiseed_summary.json
  secondary_descriptive_only:
    - outputs/metrics/multiseed/patient_seed_deltas.csv
  secondary_note: >-
    If the per-patient file is produced it is descriptive material only. Its
    6 patients x 5 seeds are not 30 independent observations; the seed-level
    paired analysis remains the primary evidence about training-randomness
    stability.

per_seed_metric_directory: outputs/metrics/multiseed/seed{seed}
per_seed_run_directory: outputs/runs/{method}_seed{seed}
per_seed_checkpoint: outputs/checkpoints/{method}_seed{seed}_best.pt
